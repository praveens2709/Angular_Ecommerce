<div class="search-wrap position-relative">
  <button type="button" class="icon-btn" [class.light]="light" (click)="toggle()" [attr.aria-expanded]="open" aria-label="Search products">
    <i class="pi" [ngClass]="open ? 'pi-times' : 'pi-search'"></i>
  </button>

  <div *ngIf="open" class="search-panel position-absolute">
    <form (ngSubmit)="submit()" class="d-flex align-items-center gap-2" role="search">
      <i class="pi pi-search text-secondary"></i>
      <input
        #input
        type="search"
        name="q"
        class="flex-grow-1"
        placeholder="Search products, colours, categories"
        autocomplete="off"
        [(ngModel)]="query"
        (ngModelChange)="onInput()"
        (keydown)="onKeydown($event)"
      />
      <i *ngIf="searching" class="pi pi-spin pi-spinner text-secondary"></i>
    </form>

    <ul *ngIf="suggestions.length" class="list-unstyled mb-0 mt-2" role="listbox">
      <li
        *ngFor="let p of suggestions; let i = index"
        role="option"
        [attr.aria-selected]="i === activeIndex"
        [class.active]="i === activeIndex"
        class="d-flex align-items-center gap-2"
        (mousedown)="$event.preventDefault()"
        (click)="goToProduct(p)"
      >
        <img [src]="p.image | optImg : 40" alt="" decoding="async" />
        <div class="flex-grow-1 overflow-hidden">
          <div class="name">{{ p.name }}<span *ngIf="p.color" class="text-secondary"> · {{ p.color }}</span></div>
          <small class="text-secondary">{{ p.category }}</small>
        </div>
        <span class="price">{{ p.price | currency : 'INR' : 'symbol' : '1.0-0' }}</span>
      </li>
      <li class="see-all" (mousedown)="$event.preventDefault()" (click)="activeIndex = -1; submit()">
        See all results for "{{ query.trim() }}" <i class="pi pi-arrow-right ms-1"></i>
      </li>
    </ul>
    <p *ngIf="!searching && query.trim().length >= 2 && !suggestions.length" class="mb-0 mt-2 small text-secondary">
      No matches. Press Enter to search anyway.
    </p>
  </div>
</div>
