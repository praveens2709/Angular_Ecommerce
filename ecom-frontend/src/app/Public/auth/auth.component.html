<div class="parent d-flex justify-content-center align-items-center">
  <div class="container position-relative bg-white">
    <div class="form-box login position-absolute end-0 bg-white d-flex flex-column justify-content-center">
      <app-login *ngIf="mode === 'login'" (switchToRegister)="mode = 'register'" (forgotPassword)="mode = 'forgot'"></app-login>
      <app-register *ngIf="mode === 'register'" (switchToLogin)="mode = 'login'"></app-register>
      <app-forgot-password *ngIf="mode === 'forgot'" (backToLogin)="mode = 'login'"></app-forgot-password>
    </div>
    <div class="left-box position-absolute w-100 h-100">
      <div
        class="left-panel left position-absolute h-100 text-white d-flex flex-column justify-content-center align-items-center"
      >
        <span class="panel-logo" aria-hidden="true">DopeShope</span>
        <h1 class="panel-title">Welcome!</h1>
        <p class="panel-sub">Free shipping · Cash on delivery · 7-day returns</p>
      </div>
    </div>
  </div>
</div>
