<div class="parent d-flex justify-content-center align-items-center">
  <div class="container position-relative bg-white">
    <div class="form-box login position-absolute end-0 bg-white d-flex flex-column justify-content-center">
      <form [formGroup]="form" (ngSubmit)="submit()" class="w-100">
        <h1 class="text-center mb-3">New password</h1>

        <ng-container *ngIf="token; else missingToken">
          <div class="input-box position-relative">
            <i class="pi pi-lock position-absolute top-50 translate-middle-y ms-2"></i>
            <input type="password" placeholder="New password" class="form-control ps-4" formControlName="password" autocomplete="new-password" />
            <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-danger small-error">At least 6 characters</small>
          </div>
          <div class="input-box position-relative">
            <i class="pi pi-lock position-absolute top-50 translate-middle-y ms-2"></i>
            <input type="password" placeholder="Confirm password" class="form-control ps-4" formControlName="confirm" autocomplete="new-password" />
            <small *ngIf="form.errors?.['mismatch'] && form.get('confirm')?.touched" class="text-danger small-error">Passwords don't match</small>
          </div>
          <p *ngIf="error" class="form-error" role="alert">{{ error }}</p>
          <button type="submit" [disabled]="form.invalid || saving" class="btn border-0 text-white fw-semibold rounded-2">
            {{ saving ? 'Saving…' : 'Update password' }}
          </button>
        </ng-container>

        <ng-template #missingToken>
          <p class="text-center">This reset link is incomplete. Please request a new one.</p>
        </ng-template>

        <p class="text-center mt-3"><a routerLink="/public/auth" class="text-orange">Back to login</a></p>
      </form>
    </div>
    <div class="left-box position-absolute w-100 h-100">
      <div class="left-panel left position-absolute h-100 text-white d-flex flex-column justify-content-center align-items-center">
        <span class="panel-logo" aria-hidden="true">DopeShope</span>
        <h1 class="panel-title">Welcome back!</h1>
        <p class="panel-sub">Free shipping · Cash on delivery · 7-day returns</p>
      </div>
    </div>
  </div>
</div>
