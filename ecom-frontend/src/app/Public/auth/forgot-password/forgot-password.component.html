<form [formGroup]="form" (ngSubmit)="submit()" class="w-100">
  <h1 class="text-center mb-3">Forgot password</h1>

  <ng-container *ngIf="!sent; else sentMessage">
    <p class="text-center text-secondary">Enter your account email and we'll send you a link to reset your password.</p>
    <div class="input-box position-relative">
      <i class="pi pi-at position-absolute top-50 translate-middle-y ms-2"></i>
      <input type="email" placeholder="Email" class="form-control ps-4" formControlName="email" autocomplete="email" />
      <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger small-error">Enter a valid email</small>
    </div>
    <p *ngIf="error" class="form-error" role="alert">{{ error }}</p>
    <button type="submit" [disabled]="form.invalid || sending" class="btn border-0 text-white fw-semibold rounded-2">
      {{ sending ? 'Sending…' : 'Send reset link' }}
    </button>
  </ng-container>

  <ng-template #sentMessage>
    <p class="text-center">
      If an account exists for <strong>{{ form.value.email }}</strong>, a reset link is on its way. It's valid for 1 hour.
    </p>
  </ng-template>

  <p class="text-center mt-3">
    Remembered it? <a (click)="backToLogin.emit()" class="text-orange">Back to login</a>
  </p>
</form>
