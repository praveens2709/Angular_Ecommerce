<header appPinnedHeader class="cart-header animate one fadeInUp">
  <div class="container d-flex justify-content-between align-items-center gap-3">
    <a routerLink="/" class="logo" aria-label="DopeShope home">DopeShope</a>

    <ol class="steps d-flex align-items-center mb-0" aria-label="Checkout steps">
      <li
        *ngFor="let step of steps; let i = index; let last = last"
        class="step d-flex align-items-center"
        [class.done]="i < currentIndex"
        [class.current]="i === currentIndex"
      >
        <!-- Earlier steps are links back; later steps aren't reachable yet -->
        <a *ngIf="i < currentIndex; else plain" [routerLink]="step.path" class="d-flex align-items-center gap-2">
          <span class="num"><i class="pi pi-check"></i></span><span class="label">{{ step.label }}</span>
        </a>
        <ng-template #plain>
          <span class="d-flex align-items-center gap-2" [attr.aria-current]="i === currentIndex ? 'step' : null">
            <span class="num">{{ i + 1 }}</span><span class="label">{{ step.label }}</span>
          </span>
        </ng-template>
        <span *ngIf="!last" class="bar" [class.filled]="i < currentIndex"></span>
      </li>
    </ol>

    <div class="secure d-flex gap-2 align-items-center">
      <i class="pi pi-lock"></i>
      <span>100% Secure</span>
    </div>
  </div>
  <app-scroll-progress></app-scroll-progress>
</header>
