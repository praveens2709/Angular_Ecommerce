<!-- Header Section -->
<div appPinnedHeader class="container-fluid dopeshope-navbar bg-white shadow-lg animate one fadeInUp">
  <div class="container">
    <div class="text-center fs-6 pt-1 dopeshope">DopeShope</div>
    <div class="d-flex justify-content-evenly m-auto navbar">
      <!-- Phones: the menu button replaces the text links -->
      <app-mobile-menu></app-mobile-menu>
      <a routerLink="/home" class="nav-text-link position-relative px-2">Home</a>
      <a routerLink="/shop" routerLinkActive="active" class="nav-text-link position-relative px-2">Products</a>
      <a routerLink="/account" routerLinkActive="active" class="nav-text-link position-relative px-2">Account</a>
      <div class="nav-icons d-flex align-items-center gap-2 gap-sm-3 gap-md-4">
      <app-search-bar></app-search-bar>
      <a routerLink="/account/wishlist" class="position-relative icon-link" aria-label="Wishlist">
        <i class="pi pi-heart"></i>
        <span *ngIf="wishlistCount > 0" class="wish-count position-absolute">{{ wishlistCount }}</span>
      </a>
      <div class="position-relative">
        <a routerLink="/cart" routerLinkActive="active" class="position-relative">
          <i class="pi pi-shopping-bag"></i>
        </a>
        <div
          class="cart-count rounded-circle bg-danger text-white fw-bold d-flex justify-content-center align-items-center position-absolute">
          {{ cartCount }}
        </div>
      </div>
      </div>
    </div>
  </div>
  <!-- Scroll progress along the header's bottom edge, so it moves with the header -->
  <app-scroll-progress></app-scroll-progress>
</div>
