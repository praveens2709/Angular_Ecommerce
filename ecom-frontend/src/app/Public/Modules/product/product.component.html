<app-header></app-header>
<!-- Fills the screen so the footer stays below the fold while content loads -->
<div class="page-fill">
<app-common-banner></app-common-banner>

<div class="container mt-4 mt-lg-5 mb-2">
  <div class="row">
    <!-- Filters: sidebar on desktop, bottom sheet on phones/tablets (same content) -->
    <aside class="col-lg-3 shop-left d-none d-lg-block">
      <div class="filter-panel">
        <ng-container *ngTemplateOutlet="filterContent"></ng-container>
      </div>
    </aside>

    <div class="col-lg-9 shop-right">
      <!-- Phones/tablets: filter button + sort pills -->
      <div class="mobile-toolbar d-flex d-lg-none align-items-center gap-2 mb-3">
        <button type="button" class="filter-trigger d-flex align-items-center gap-2" (click)="openFilterSheet()">
          <i class="pi pi-sliders-h"></i> Filters
          <span *ngIf="activeFilterCount" class="filter-count">{{ activeFilterCount }}</span>
        </button>
        <ng-container *ngTemplateOutlet="sortPills"></ng-container>
      </div>

      <div class="product-topbar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <p class="mb-0 result-count">{{ getDisplayedRange() }}</p>
        <div class="d-none d-lg-flex align-items-center gap-2 sort-wrap">
          <span class="sort-label">Sort</span>
          <ng-container *ngTemplateOutlet="sortPills"></ng-container>
        </div>
      </div>

      <!-- Active filters as removable chips -->
      <div *ngIf="activeFilterCount" class="active-chips d-flex flex-wrap align-items-center gap-2 mb-2">
        <button *ngIf="searchQuery" type="button" class="chip" (click)="clearSearch()" [attr.aria-label]="'Remove search ' + searchQuery">
          “{{ searchQuery }}” <i class="pi pi-times"></i>
        </button>
        <button *ngFor="let category of selectedCategories" type="button" class="chip" (click)="toggleCategory(category)" [attr.aria-label]="'Remove ' + category">
          {{ category }} <i class="pi pi-times"></i>
        </button>
        <button *ngFor="let filter of selectedPriceFilters" type="button" class="chip" (click)="togglePriceFilter(filter)" [attr.aria-label]="'Remove ' + priceLabel(filter)">
          {{ priceLabel(filter) }} <i class="pi pi-times"></i>
        </button>
        <button type="button" class="chip-clear" (click)="clearFilters()">Clear all</button>
      </div>

      <div *ngIf="!loading && paginatedProducts.length === 0" class="text-center py-5">
        <i class="pi pi-search fs-2 text-secondary"></i>
        <p class="mt-3 mb-1 fw-semibold">No products match your filters</p>
        <button type="button" class="btn btn-link text-orange p-0" (click)="clearFilters()">Clear all filters</button>
      </div>
      <div *ngIf="loading && paginatedProducts.length === 0" class="row g-2 g-sm-3" aria-hidden="true">
        <div class="col-6 col-sm-6 col-md-4 col-lg-3 mt-2 mt-sm-3" *ngFor="let _ of skeletonCards">
          <div class="skeleton card-skeleton-img"></div>
          <div class="skeleton skeleton-line mt-2 w-75"></div>
          <div class="skeleton skeleton-line w-50"></div>
        </div>
      </div>
      <div class="row g-2 g-sm-3 shop-grid" [class.refreshing]="loading">
        <div class="col-6 col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center animated mt-2 mt-sm-3" *ngFor="let product of paginatedProducts; trackBy: trackById">
          <app-product-card class="w-100" [product]="product" [colours]="coloursFor(product)"></app-product-card>
        </div>
      </div>
      <!-- Pagination -->
      <div class="divider3"></div>
      <p-paginator [rows]="rowsPerPage" [first]="currentPage * rowsPerPage" [totalRecords]="totalProducts" (onPageChange)="onPageChange($event)">
      </p-paginator>
    </div>
  </div>
</div>
</div>

<!-- Phones/tablets: filters in a bottom sheet -->
<div class="filter-sheet-root d-lg-none" [class.open]="filterSheetOpen" [attr.aria-hidden]="!filterSheetOpen">
  <div class="sheet-overlay" (click)="closeFilterSheet()"></div>
  <section class="filter-sheet" role="dialog" aria-label="Filters" [attr.inert]="filterSheetOpen ? null : ''">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Filters</h5>
      <button type="button" class="sheet-close" (click)="closeFilterSheet()" aria-label="Close filters"><i class="pi pi-times"></i></button>
    </header>
    <div class="sheet-body">
      <ng-container *ngTemplateOutlet="filterContent; context: { inSheet: true }"></ng-container>
    </div>
    <footer class="sheet-foot d-flex gap-2">
      <button type="button" class="sheet-btn" (click)="clearFilters()" [disabled]="!activeFilterCount">Clear all</button>
      <button type="button" class="sheet-btn primary" (click)="closeFilterSheet()">
        {{ loading ? 'Updating…' : 'Show ' + totalProducts + (totalProducts === 1 ? ' result' : ' results') }}
      </button>
    </footer>
  </section>
</div>

<ng-template #sortPills>
  <div class="sort-pills d-flex gap-2" role="radiogroup" aria-label="Sort products">
    <button
      *ngFor="let option of sortOptions"
      type="button"
      class="pill"
      role="radio"
      [attr.aria-checked]="selectedSort === option.value"
      [class.active]="selectedSort === option.value"
      (click)="setSort(option.value)"
    >{{ option.short }}</button>
  </div>
</ng-template>

<ng-template #filterContent let-inSheet="inSheet">
  <form class="filter-search position-relative" (ngSubmit)="applyFilters()">
    <i class="pi pi-search position-absolute"></i>
    <input type="search" placeholder="Search products" [(ngModel)]="searchQuery" name="searchQuery" aria-label="Search products" />
  </form>

  <div *ngIf="!inSheet" class="filter-head d-flex justify-content-between align-items-center">
    <h6 class="mb-0">Filters</h6>
    <button type="button" class="link-btn" (click)="clearFilters()" [disabled]="!activeFilterCount">Clear all</button>
  </div>

  <div class="filter-group">
    <p class="group-title">Category</p>
    <div class="d-flex flex-wrap gap-2">
      <button
        *ngFor="let category of categories"
        type="button"
        class="pill"
        [class.active]="isCategorySelected(category.name)"
        [attr.aria-pressed]="isCategorySelected(category.name)"
        (click)="toggleCategory(category.name)"
      >{{ category.name }}</button>
      <span *ngIf="!categories.length" class="text-muted small">Loading…</span>
    </div>
  </div>

  <div class="filter-group">
    <p class="group-title">Price</p>
    <div class="d-flex flex-wrap gap-2">
      <button
        *ngFor="let filter of priceFilters"
        type="button"
        class="pill"
        [class.active]="isPriceFilterSelected(filter)"
        [attr.aria-pressed]="isPriceFilterSelected(filter)"
        (click)="togglePriceFilter(filter)"
      >{{ priceLabel(filter) }}</button>
    </div>
  </div>
</ng-template>

<app-site-footer></app-site-footer>
