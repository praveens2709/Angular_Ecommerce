<div class="mt-2">
  <h6 class="pb-2 fw-semibold">Wishlist</h6>

  <ng-container *ngIf="isLoggedIn; else notLoggedIn">
    <ng-container *ngIf="items$ | async as items">
      <div *ngIf="items.length === 0" class="empty text-center py-5">
        <i class="pi pi-heart fs-1"></i>
        <p class="fw-semibold mt-3 mb-1">Your wishlist is empty</p>
        <p class="text-secondary mb-3">Tap the heart on any product to save it for later.</p>
        <a routerLink="/shop" class="text-orange fw-semibold">Explore products</a>
      </div>

      <div class="row g-3" *ngIf="items.length > 0">
        <div class="col-6 col-md-4" *ngFor="let product of items; trackBy: trackById">
          <app-product-card [product]="product" [removable]="true" [imageWidth]="220"></app-product-card>
        </div>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #notLoggedIn>
    <div class="profile-box2 px-5 py-4 mt-2">
      <p class="text-center mt-3">Please <a routerLink="/public/auth" class="text-orange">Sign In</a> to see your wishlist.</p>
    </div>
  </ng-template>
</div>
