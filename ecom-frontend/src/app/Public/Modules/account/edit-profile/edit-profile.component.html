<div class="profile-box2 p-3 p-sm-4 p-md-5 mt-2">
  <h6 class="pb-2 border-bottom">Edit Profile</h6>
  <div class="contact-right position-relative">
    <form [formGroup]="profileForm">
      <!-- Mobile Number -->
      <div class="mobile-row p-2 my-3 d-flex justify-content-between align-items-center gap-3">
        <div class="d-flex flex-column edit-profile flex-grow-1">
          <label for="mobile" class="mb-1 fw-medium">Mobile Number*</label>
          <p *ngIf="!editingMobile" class="mb-0 d-flex gap-1 align-items-center contact-verified">
            {{ profileForm.value.mobile || user.mobile }}
            <i class="pi pi-check-circle text-success"></i>
          </p>
          <ng-container *ngIf="editingMobile">
            <input id="mobile" type="tel" inputmode="numeric" maxlength="10" formControlName="mobile" class="form-control" placeholder="10-digit mobile number" />
            <small *ngIf="profileForm.get('mobile')?.invalid" class="text-danger">Enter a valid 10-digit mobile number</small>
          </ng-container>
        </div>
        <button type="button" class="change-link" (click)="editingMobile = !editingMobile">
          {{ editingMobile ? 'Done' : 'Change' }}
        </button>
      </div>

      <!-- Full Name -->
      <label for="fullName" class="fw-medium mb-1 w-100">Full Name*</label>
      <input
        id="fullName"
        type="text"
        formControlName="fullName"
        class="form-control mb-3"
        placeholder="Enter full name"
      />

      <!-- Email -->
      <label for="email" class="fw-medium mb-1 w-100">Email*</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-control mb-3"
        placeholder="Enter email"
      />

      <!-- Birthday -->
      <label for="birthday" class="fw-medium mb-1 w-100">Birthday</label>
      <div class="calendar-input-wrapper d-flex align-items-center justify-content-between mb-3">
        <p-calendar
          id="birthday"
          formControlName="birthday"
          placeholder="Select birthday"
          dateFormat="dd/mm/yy"
          class="custom-calendar w-100"
        ></p-calendar>
        <i class="pi pi-calendar"></i>
      </div>

      <!-- Gender -->
      <label class="fw-medium mb-1 w-100">Gender</label>
      <div class="d-flex mb-3 gap-3">
        <div
          class="gender-input"
          [ngClass]="{ active: profileForm.get('gender')?.value === 'Male' }"
          (click)="selectGender('Male')"
        >
          Male
        </div>
        <div
          class="gender-input"
          [ngClass]="{ active: profileForm.get('gender')?.value === 'Female' }"
          (click)="selectGender('Female')"
        >
          Female
        </div>
      </div>

      <!-- Save Button -->
      <div class="d-flex justify-content-between mt-3">
        <button
          pButton
          type="button"
          class="w-100 py-2"
          label="Save Details"
          [disabled]="!hasFormChanged() || profileForm.invalid"
          (click)="showSaveDialog()"
        ></button>
      </div>
    </form>
  </div>

  <!-- Back to Profile Button -->
  <div class="d-flex justify-content-center">
    <button
      pButton
      type="button"
      class="mt-3 px-3"
      label="Back to Profile"
      (click)="handleBackToProfileClick()"
    ></button>
  </div>
</div>

<app-common-dialog
  [visible]="isDialogVisible"
  title="Save Changes"
  message="Are you sure you want to save your profile details?"
  confirmButtonText="Save"
  cancelButtonText="Cancel"
  [error]="saveError"
  (confirm)="confirmSave()"
  (cancel)="isDialogVisible = false"
  (close)="isDialogVisible = false"
></app-common-dialog>
