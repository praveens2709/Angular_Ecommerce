<div class="layout-container">
  <!-- Sidenav: slim icon rail; the logo toggles the wide version with labels -->
  <nav class="sidenav" [ngClass]="collapsed ? 'sidenav-collapsed' : ''" aria-label="Admin">
    <div class="logo-container">
      <button type="button" class="logo-btn" (click)="toggleCollapse()" [attr.aria-expanded]="collapsed" aria-label="Toggle menu">
        <img class="logo" src="assets/images/ds-logo.png" alt="" />
      </button>
      <div class="logo-text" @fadeInOut *ngIf="collapsed">
        DopeShope
        <small>Admin</small>
      </div>
      <button type="button" class="btn-close-nav" @fadeInOut (click)="closeSidenav()" *ngIf="collapsed" aria-label="Collapse menu">
        <i class="pi pi-angle-double-left"></i>
      </button>
    </div>
    <ul class="sidenav-nav">
      <li class="sidenav-nav-item" *ngFor="let data of navData">
        <a
          class="sidenav-nav-link"
          [routerLink]="[data.routerLink]"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="collapsed ? null : data.label"
          [attr.aria-label]="data.label"
        >
          <i class="sidenav-link-icon" [class]="data.icon"></i>
          <span class="sidenav-link-text" @fadeInOut *ngIf="collapsed">{{ data.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Top bar -->
  <header class="header">
    <div class="header-title">
      <img class="header-logo" src="assets/images/ds-logo.png" alt="" />
      <span>DopeShope <span class="muted">Admin</span></span>
    </div>

    <div class="header-actions">
      <a routerLink="/home" target="_blank" class="head-btn" title="View store">
        <i class="pi pi-external-link"></i><span class="label">View store</span>
      </a>
      <button type="button" class="head-btn" title="Logout" (click)="logout()">
        <i class="pi pi-sign-out"></i><span class="label">Logout</span>
      </button>
    </div>
  </header>
</div>
